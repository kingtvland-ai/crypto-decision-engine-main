# ⚠️ ROOT DIRECTORY MUST STAY EMPTY (the repository root). Do not set it to
# `server`, however tempting that looks for a worker that lives there.
#
# Render's own docs, on the Root Directory field: "code changes outside of this
# directory do not trigger an auto-deploy." The worker BUNDLE pulls 28 modules
# from ../src — decisionEngine, proAlgEngine, intradayEngine, marketDataService
# and the rest — because every trading decision is computed by shared code, not
# by anything under server/. Render still checks out the whole repo, so those
# imports resolve and the build SUCCEEDS either way. It simply stops
# redeploying when the engine changes.
#
# That is the worst possible failure mode: green builds, a healthy /health, and
# a worker silently running last month's decision engine. It is exactly what
# happened — a fix to src/services/decisionEngine/** was pushed to main and the
# worker went on answering with the old code.
#
# The commands below assume the repo root. If Root Directory is ever set to
# `server`, they must become `npm install && npm run build` and
# `node dist/worker.js` — and auto-deploy on engine changes is lost.
#
# Separately: the live hostname (crypto-decision-engine-main-hev8.onrender.com)
# is derived from the REPO name, not from `name` below, so this service was
# created by hand rather than from this blueprint. Do NOT "tidy" the name to
# match: Render identifies a blueprint-managed service BY that name, so
# renaming one that IS managed here makes Render treat it as new, orphaning the
# running service and killing the hostname baked into VITE_TRADING_API_URL.
services:
  - type: web
    name: crypto-trading-worker
    runtime: node
    plan: free
    buildCommand: npm install && npm --prefix server install && npm --prefix server run build
    startCommand: node server/dist/worker.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: BYBIT_API_KEY
        sync: false
      - key: BYBIT_SECRET_KEY
        sync: false
      - key: BOT_ADMIN_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: BYBIT_TESTNET
        value: "false"
      - key: BOT_DRY_RUN
        value: "true"
      - key: BOT_AUTOSTART
        value: "false"
      - key: BOT_RISK_LEVEL
        value: "medium"
      - key: BOT_SYMBOLS
        value: "100"
      # A SIGNAL SCORE (0-100), and it reaches only the three score-scaled sim
      # bots plus the live bot. It deliberately does NOT reach the 4H Path bot,
      # whose "confidence" is the Wilson lower bound of a hit rate — a
      # probability. Setting 60 there asked for a bucket that wins 60% of the
      # time at a 1.5R target; none exists, so the bot fell silent while this
      # read like an ordinary setting. simDefaults.ts enforces the split.
      - key: BOT_MIN_CONFIDENCE
        value: "60"
      # The same floor for the one bot that speaks probabilities. Unset = 33,
      # the calibrated default. Raise it to make bot 4 pickier; anything above
      # ~50 will silence it, which is the point of it being a separate knob.
      - key: BOT_PATH_MIN_CONFIDENCE
        sync: false
      - key: BOT_POSITION_PERCENT
        value: "10"
      # Applies to the live bot AND all four sims, so they measure the strategy
      # the live bot is actually allowed to run. The code's own base is 5; this
      # overrides it for every bot at once.
      - key: BOT_MAX_OPEN_POSITIONS
        value: "7"
      - key: BOT_MAX_FUTURES_POSITIONS
        value: "2"
      - key: BOT_SCAN_CONCURRENCY
        value: "5"
      - key: BOT_SCAN_INTERVAL_SECONDS
        value: "300"
      - key: BOT_KLINE_INTERVAL
        value: "240"
      - key: BOT_RATE_LIMIT_MAX
        value: "300"
      - key: BOT_RATE_LIMIT_WINDOW_MS
        value: "120000"
      - key: BOT_REQUEST_TIMEOUT_MS
        value: "15000"
      - key: CORS_ORIGIN
        # Explicit frontend origins only; no wildcard. Keep local origins for
        # browser testing and the production Netlify origin for deployment.
        value: "https://crypto-d.netlify.app,http://localhost:8080,http://localhost:5173"
      - key: PORT
        value: "3001"

