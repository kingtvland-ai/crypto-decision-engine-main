[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "24"
  # Baked into the bundle at build time. Without it a fresh clone builds a site
  # with no worker address at all, and /live cannot load for anyone. A value set
  # in the Netlify dashboard overrides this one.
  VITE_TRADING_API_URL = "https://cde-main.onrender.com"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
