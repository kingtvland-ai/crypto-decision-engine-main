name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.node.json
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build:worker
      - run: npm run build
      - run: npm test
      - run: npx tsc --noEmit -p tsconfig.e2e.json

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # Chromium only — see playwright.config.ts. Every test mocks the worker
      # network boundary (e2e/fixtures/mockWorker.ts), so this needs no
      # backend and no secrets.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
